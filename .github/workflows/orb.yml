name: EdgeDesk ORB bot

on:
  schedule:
    - cron: "57 3 * * 1-5"   # 09:27 IST, Mon-Fri. Runs until 15:20 IST, checking every minute.
  workflow_dispatch:          # or start it by hand: Actions -> EdgeDesk ORB bot -> Run workflow

permissions:
  contents: write

concurrency:
  group: edgedesk-orb
  cancel-in-progress: false

jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch BANK NIFTY and send ORB alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orb_bot.py
      - name: Save the ORB record
        if: always()
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orb_state.json data/news_log.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "ORB record $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep $((i * 5)); done
          exit 1
          # enabled by owner
