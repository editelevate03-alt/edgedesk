name: EdgeDesk analyse symbols
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "NSE symbols separated by spaces"
        required: true
      telegram:
        description: "1 = send the report to Telegram (and don't print it)"
        required: false
        default: "0"
      style:
        description: "normal or simple (plain language for family)"
        required: false
        default: "normal"
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python analyse_list.py
        env:
          SYMBOLS: ${{ inputs.symbols }}
          SEND_TG: ${{ inputs.telegram }}
          STYLE: ${{ inputs.style }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
