name: EdgeDesk stock analyser

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgedesk-bots
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan NIFTY 500 for swing setups
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_scanner.py
      - name: Save results
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scanner.json
          git diff --cached --quiet && exit 0
          git commit -m "Scanner $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep $((i * 5)); done
          exit 1
          # enabled by owner
