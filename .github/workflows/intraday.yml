name: EdgeDesk gap-fade bot

on:
  schedule:
    - cron: "48 3 * * 1-5"   # 09:18 IST Mon-Fri; runs until the trades close (max 15:20 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgedesk-gapfade
  cancel-in-progress: false

jobs:
  gapfade:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch gaps and send gap-fade alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gapfade_bot.py
      - name: Save the gap-fade record
        if: always()
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gapfade_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Gap-fade record $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep $((i * 5)); done
          exit 1
