name: EdgeDesk bots

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, off the busy :00 mark (GitHub may still delay runs)
  workflow_dispatch:          # "Run workflow" button: also sends "EdgeDesk is connected" to Telegram

permissions:
  contents: write             # lets the bot commit data/signals.json

concurrency:
  group: edgedesk-bots
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the Chief and 10 bots
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot.py --hello
          else
            python bot.py
          fi

      - name: Website login (from the SITE_LOGIN secret)
        env:
          SITE_LOGIN: ${{ secrets.SITE_LOGIN }}
        run: python site_login.py

      - name: Commit new data
        if: always()
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/signals.json data/state.json data/auth.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update signals $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
          # enabled by owner
