name: EdgeDesk chat bot

on:
  workflow_dispatch:   # started automatically ~9:05 and ~15:40 IST; listens ~6 hours each time

permissions:
  contents: write

concurrency:
  group: edgedesk-chat
  cancel-in-progress: true   # a new start replaces the old listener (only one can read Telegram)

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore private chat state (holdings are NOT stored in the public repo)
        uses: actions/cache/restore@v4
        with:
          path: data/chat_state.json
          key: chat-state-${{ github.run_id }}
          restore-keys: chat-state-
      - name: Answer Telegram messages
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python chat_bot.py --minutes 345
      - name: Save private chat state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/chat_state.json
          key: chat-state-${{ github.run_id }}
