name: EdgeDesk breakout swing bot

on:
  schedule:
    - cron: "17 10 * * 1-5"   # 15:47 IST Mon-Fri, after the market closes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgedesk-swing
  cancel-in-progress: false

jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Manage swing trades and scan for breakouts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breakout_bot.py
      - name: Save the swing record
        if: always()
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/breakout_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Swing record $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep $((i * 5)); done
          exit 1
