name: EdgeDesk research

on:
  workflow_dispatch:   # run by hand: Actions -> EdgeDesk research -> Run workflow

permissions:
  contents: write

concurrency:
  group: edgedesk-bots
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest all strategies (1 year, 5 years, hourly forex)
        run: python research.py
      - name: India report for Kite (sends to Telegram)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python india_report.py --no-telegram
      - name: F&O option-buying report (NIFTY / BANK NIFTY, sends to Telegram)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fno_research.py
      - name: Save results
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research.json data/research.md data/india_report.md data/india_report.json data/fno_report.md data/fno_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Research results $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep $((i * 5)); done
          exit 1
