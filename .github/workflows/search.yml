name: EdgeDesk strategy search

on:
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * 1-5"   # 07:11 IST on weekdays: re-test strategies before the market opens

permissions:
  contents: write

concurrency:
  group: edgedesk-bots
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward strategy search (finds GREEN strategies)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fno_search.py
      - name: Save results
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search_report.md data/green_strategies.json
          git diff --cached --quiet && exit 0
          git commit -m "Strategy search $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep $((i * 5)); done
          exit 1
